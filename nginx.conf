server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and bootstrap files must never be cached, or a
    # rebuilt image keeps serving the old app.
    location ~* ^/(flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
