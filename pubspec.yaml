name: nori
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/nori_breathing/

# firebase_core_web 3.11.0 requires Dart >=3.12.0 (isA<T>() on Object) but this
# project is on Dart 3.10.7 — see https://github.com/firebase/flutterfire/issues/18611
dependency_overrides:
  firebase_core_web: 3.10.0
